# Builds the Docker image (linux/amd64) and checks that it starts, asks for its password and answers its health
# check. It publishes the image to ghcr.io only when run by hand with "publish" ticked: the image bundles GPL and
# AGPL programs (ffmpeg, Rubber Band, PyMuPDF), so making a copy public is the repository owner's decision.
name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - server.py
      - bhajan/**
      - static/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - server.py
      - bhajan/**
      - static/**
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io (it bundles GPL/AGPL programs; see the note at the top)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # used only by the publish step
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bhajan-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name bhajan -p 127.0.0.1:8777:8777 -e BHAJAN_PASSWORD=ci bhajan-studio:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8777/api/health && break
            sleep 2
          done
          echo
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -fsS http://127.0.0.1:8777/ | grep -q 'action="/api/login"'           # the sign-in page
          curl -fsS -u any:ci http://127.0.0.1:8777/ | grep -q 'brand-mark'          # the app
          test "$(code 'http://127.0.0.1:8777/api/search?q=sai')" = 401
          test "$(code -u any:wrong 'http://127.0.0.1:8777/api/search?q=sai')" = 401
          test "$(code -u any:ci 'http://127.0.0.1:8777/api/search?q=sai')" = 200
          curl -fsS http://127.0.0.1:8777/api/health | python3 -c 'import json, sys; h = json.load(sys.stdin); assert h["ok"] and h["parts"] and h["ocr"] == "tesseract", h; print(h)'
          docker exec bhajan id
          docker exec bhajan python -c "import torch, audio_separator; print('torch', torch.__version__)"
          docker exec bhajan tesseract --version
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' bhajan)
            [ "$status" = healthy ] && break
            sleep 5
          done
          echo "health: $status"
          test "$status" = healthy

      - name: Container logs
        if: always()
        run: docker logs bhajan || true

      - name: Publish to ghcr.io
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bhajan-studio"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "${GITHUB_SHA::12}"; do
            docker tag bhajan-studio:ci "$image:$tag"
            docker push "$image:$tag"
          done

[project]
name = "bhajan-studio"
version = "0.2.0"
description = "Transpose Sai Rhythms bhajans to any key: read the sheet music, synthesize it, or pitch-shift the real recording."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.12",
    "pymupdf>=1.24",
    "pillow>=10",
    "certifi",
    "imageio-ffmpeg>=0.6.0",
    "pylibrb>=0.1.2",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Splitting a recording into parts (lead, group, tabla, harmonium). Installed the first time a
# recording is split: PyTorch plus the separation runner, about 1 GB. audioread is imported by
# audio-separator without being declared.
stems = [
    "audio-separator[cpu]==0.47.0",   # [cpu] = onnxruntime, which it imports unconditionally; PyTorch still uses the GPU (MPS)
    "audioread>=3.0",
]

[tool.uv]
package = false
